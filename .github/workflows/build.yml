#----------------------------------------------------------------------------
# KieeKey — CI/CD: x64 + ARM64 + ARM64EC release binaries on every
# push/PR/tag.
#
# What CI builds (KIEEKEY_BUILD_UI=none — the default, dependency-free
# configuration): KieeKeyApp.exe (Win32 tray app) + the static core +
# the full native test harness (ctest: 20 tests incl. ok_tests, ok_ring_tests,
# ok_wrap_tests, the correctness gate, differential A/B, option matrix,
# performance profiles and the ok_version_check release gate).
#
# v1.2.2 RC4: the x64 job additionally enforces `SHA256SUMS.txt --check`
# so the release manifest cannot silently rot between RCs.
#
# The optional WinUI 3 front-end (KIEEKEY_BUILD_UI=winui3) is NOT built in
# CI: it requires the Windows App SDK NuGet package (Microsoft.WindowsAppSDK)
# to be restored on the build machine — do that locally with
#   nuget install Microsoft.WindowsAppSDK -OutputDirectory build/nuget
# plus find_package PATHS pointing at the package, if you need it.
# CI never registers NuGet sources: steps that run `nuget sources add` /
# `dotnet nuget add source` with a name the runner image already registers
# fail with "The name specified has already been added to the list of
# available package sources. Provide a unique name."
#
# No Developer Command Prompt step: the CMake Visual Studio generator
# (`-A <platform>`) locates MSVC and selects the per-platform toolset by
# itself — including ARM64EC. Routing ARM64EC through vcvarsall.bat is what
# broke the build before ("[ERROR:vcvarsall.bat] Invalid argument found :
# arm64ec" — vcvarsall has no `arm64ec` architecture argument).
#
# Unit tests (ctest) run only on the native x64 job: x64 Windows cannot
# execute ARM64/ARM64EC binaries, so those jobs are build-only.
#
# Tagged pushes (v*) additionally produce a GitHub Release with the
# per-platform artifact zips attached.
#
# v1.3.0 maintenance: all actions bumped off the Node 20 runtime
# (checkout v7, upload-artifact v7, download-artifact v8,
# action-gh-release v3 — clears the Node-20 deprecation annotations),
# and the release job now REPACKS each downloaded artifact into a
# per-platform zip before publishing. download-artifact (v4+) extracts
# artifacts on download, so the previous `files: artifacts/**/*.zip`
# glob matched NOTHING — a tagged release would have been created with
# zero binaries attached.
#----------------------------------------------------------------------------
name: build

on:
  push:
    branches: [ main, 'bench/**' ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      base_tag:
        description: 'Benchmark base tag (A/B against this tag)'
        required: false
        default: 'v1.3.0-beta5'
        type: string

jobs:
  native:
    name: Native regression (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SCCACHE_CACHE_SIZE: 300M
    steps:
      - uses: actions/checkout@v7
      - name: Install pinned compiler cache
        run: |
          python3 -m venv "$RUNNER_TEMP/sccache-tool"
          "$RUNNER_TEMP/sccache-tool/bin/pip" install --disable-pip-version-check sccache==0.10.0
          echo "CXX_LAUNCHER=$RUNNER_TEMP/sccache-tool/bin/sccache" >> "$GITHUB_ENV"
          echo "SCCACHE_DIR=$RUNNER_TEMP/sccache-data" >> "$GITHUB_ENV"
      - name: Restore compiler cache
        id: compiler-cache
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/sccache-data
          # The outer key allows updates on new commits; sccache validates the
          # compiler, flags and preprocessed source/headers for every object.
          key: native-${{ runner.os }}-${{ runner.arch }}-sccache-0.10-v2-${{ github.sha }}
          restore-keys: |
            native-${{ runner.os }}-${{ runner.arch }}-sccache-0.10-v2-
      - name: Install web-frame rasterizer (no browser required)
        run: npm install --no-save --no-package-lock @napi-rs/canvas@1.0.9
      - name: Test manifest generation
        run: python3 tests/test_sha256sums.py
      - name: Full native, UI-shim and web regression suite
        env:
          EXACT_CACHE_HIT: ${{ steps.compiler-cache.outputs.cache-hit }}
          REQUIRE_WEB_FRAMES: '1'
        run: |
          mkdir -p "$SCCACHE_DIR"
          cache_files=$(find "$SCCACHE_DIR" -type f | wc -l)
          echo "::notice title=Compiler cache before build::exact_key_hit=$EXACT_CACHE_HIT; files=$cache_files"
          bash tests/run_all_tests.sh --jobs="$(nproc)"
      - name: Compiler cache statistics
        if: always()
        run: |
          "$CXX_LAUNCHER" --show-stats
          "$CXX_LAUNCHER" --stop-server
      - name: Upload regression logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-regression-logs
          path: build/test-run/logs/
          retention-days: 14

  # ---------------------------------------------------------------------------
  # v1.3.0-beta6 (G4 + V4): the FULL no-regression benchmark campaign, run on a
  # CI runner instead of the shared dev sandbox (quieter host; closes the
  # beta5-owed e2e re-check). MANUAL ONLY (workflow_dispatch): it is a
  # campaign, not a per-push gate.
  #
  #   1. Feature isolation A/B (bench_v130_isolation): N alternating pairs,
  #      medians, FNV digest comparison — tests/run_isolation_ab.sh.
  #   2. Full bench suite A/B (engine micro, tone, e2e shim pipeline):
  #      tests/run_bench_suite.sh --ab-base=<base-tag worktree>.
  #
  # The base tag must be an ancestor of the dispatched commit; the harness
  # files are taken from the HEAD tree and compiled into BOTH sides, so the
  # campaign can only measure the engine delta.
  # ---------------------------------------------------------------------------
  bench:
    name: Benchmark A/B campaign (manual)
    # Runs on explicit workflow_dispatch OR a push to a `bench/**` branch.
    # Both are deliberate opt-ins, never per-push/per-PR gates. The
    # bench-branch form lets a scoped automation token (no Actions dispatch
    # permission) start a campaign by pushing `bench/<base-tag>`, where the
    # segment after `bench/` names the A/B base tag
    # (e.g. `bench/v1.3.0-beta5` → campaign against v1.3.0-beta5).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/bench/'))
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # the base tag must exist in this clone

      - name: Resolve base tag
        id: base
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            # refs/heads/bench/<base-tag> → strip the prefix; the rest is the tag
            BASE_TAG="${GITHUB_REF#refs/heads/bench/}"
          else
            BASE_TAG="${{ inputs.base_tag || 'v1.3.0-beta5' }}"
          fi
          git rev-parse -q --verify "refs/tags/$BASE_TAG^{commit}" \
            || { echo "::error::base tag $BASE_TAG not found"; exit 1; }
          git merge-base --is-ancestor "$BASE_TAG" HEAD \
            || { echo "::error::$BASE_TAG is not an ancestor of HEAD"; exit 1; }
          git worktree add --detach /tmp/kk-base "$BASE_TAG"
          echo "tag=$BASE_TAG" >> "$GITHUB_OUTPUT"
          echo "Base: $BASE_TAG ($(git -C /tmp/kk-base rev-parse --short HEAD)) vs HEAD ($(git rev-parse --short HEAD))"

      - name: Feature isolation A/B (15 alternating pairs, medians)
        run: |
          bash tests/run_isolation_ab.sh \
            --base=/tmp/kk-base --side=beta6-vs-${{ steps.base.outputs.tag }} \
            --rounds=15 --keys=300000 --out="$RUNNER_TEMP/iso"

      - name: Full benchmark suite A/B (micro + tone + e2e shim)
        run: |
          bash tests/run_bench_suite.sh \
            --ab-base=/tmp/kk-base --side=beta6-vs-${{ steps.base.outputs.tag }} \
            --out="$RUNNER_TEMP/benchsuite"

      - name: Campaign summary
        if: always()
        run: |
          {
            echo "## Benchmark A/B campaign (base: ${{ steps.base.outputs.tag }})"
            echo
            if [ -f "$RUNNER_TEMP/iso/iso_beta6-vs-${{ steps.base.outputs.tag }}_report.txt" ]; then
              echo '```'
              cat "$RUNNER_TEMP/iso/iso_beta6-vs-${{ steps.base.outputs.tag }}_report.txt"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload benchmark artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-ab-campaign
          path: |
            ${{ runner.temp }}/iso/
            ${{ runner.temp }}/benchsuite/
          retention-days: 90

  build:
    name: ${{ matrix.platform }}
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: x64
            cmake_args: -A x64
          - platform: ARM64
            cmake_args: -A ARM64
          - platform: ARM64EC
            cmake_args: -A ARM64EC

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Configure (CMake, Visual Studio generator — no dev prompt needed)
        run: cmake -S . -B out/${{ matrix.platform }} ${{ matrix.cmake_args }} -DCMAKE_BUILD_TYPE=Release -DKIEEKEY_BUILD_TESTS=ON -DKIEEKEY_BUILD_UI=none -DKIEEKEY_BUILD_UI_PROBE=${{ matrix.platform == 'x64' && 'ON' || 'OFF' }}

      - name: Build
        shell: pwsh
        run: |
          $log = "build-${{ matrix.platform }}.log"
          # Tee the compiler output: MSVC is the only toolchain that builds these
          # sources, so the exact diagnostics have to survive the job even when
          # the raw log is not reachable (they are surfaced as annotations on
          # the check run, and the log itself is uploaded below).
          cmake --build out/${{ matrix.platform }} --config Release --parallel 2>&1 |
              Tee-Object -FilePath $log
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            # /WX turns every level-4 warning into C2220, so the build fails on
            # the FIRST warning of each translation unit. Emit one annotation per
            # unique (code + message) so the whole fix list is visible from the
            # check-run API in a single run instead of one warning per push.
            $seen = @{}
            $unique = New-Object System.Collections.Generic.List[string]
            # Diagnostics raised inside the STL headers (xutility, xstring, …)
            # name the header, not the offending source. The `note: see
            # reference to …` lines that follow carry the instantiation site in
            # OUR tree — without them a C4244 in xutility is unfixable from the
            # annotation alone. Collect them separately.
            $notes = @{}
            $noteList = New-Object System.Collections.Generic.List[string]
            $notePattern = '^(.+\.(?:cpp|cxx|cc|hpp|hxx|h))\((\d+)(,\d+)?\):\s*note:\s*(.*)$'
            foreach ($line in (Get-Content $log)) {
              if ($line -match $notePattern) {
                $rel = $matches[1]
                if ($rel.Length -gt 110) { $rel = $rel.Substring($rel.Length - 110) }
                $nline = $matches[2]
                $noteText = ($matches[4] -replace '\s*\[[^\[\]]*\.vcxproj\]$', '').Trim()
                if ($noteText.Length -gt 200) { $noteText = $noteText.Substring(0, 200) }
                $nkey = "$rel($nline)"
                if (-not $notes.ContainsKey($nkey)) {
                  $notes[$nkey] = $true
                  $noteList.Add("instantiation site: $rel($nline) -- $noteText")
                }
              }
              if ($line -match '^(.*?)\((\d+)(,\d+)?\):\s*(error|warning)\s+([A-Z]+[0-9]+):\s*(.*)$') {
                $file = $matches[1]
                $lineno = $matches[2]
                $code_ = $matches[5]
                $msg = $matches[6]
                # strip the trailing " [D:\...\proj.vcxproj]" project tag
                $msg = ($msg -replace '\s*\[[^\[\]]*\.vcxproj\]$', '').Trim()
                $key = "$code_|$msg"
                if (-not $seen.ContainsKey($key)) {
                  $seen[$key] = $true
                  $entry = "$code_ $msg  <- $file($lineno)"
                  if ($entry.Length -gt 880) { $entry = $entry.Substring(0, 880) }
                  $unique.Add($entry)
                }
              }
            }
            foreach ($entry in ($noteList | Select-Object -First 20)) {
              Write-Host "::error::$entry"
            }
            if ($unique.Count -eq 0) {
              $tail = (Get-Content $log -Tail 25 -ErrorAction SilentlyContinue) -join ' | '
              Write-Host "::error::build failed with no parsed diagnostic; tail: $tail"
            } else {
              Write-Host "::error::$($unique.Count) unique diagnostics (first 50 shown)"
              foreach ($entry in ($unique | Select-Object -First 50)) {
                Write-Host "::error::$entry"
              }
            }

            # /WX stops each translation unit at its first warning, so the list
            # above is incomplete. Rebuild once with warnings-as-errors disabled
            # (KIEEKEY_WERROR=OFF) and report the FULL inventory, deduplicated —
            # one push then tells the whole story instead of one warning per run.
            Write-Host "::notice::re-running the build with KIEEKEY_WERROR=OFF to list every warning"
            cmake -S . -B out/diag ${{ matrix.cmake_args }} -DCMAKE_BUILD_TYPE=Release -DKIEEKEY_BUILD_TESTS=ON -DKIEEKEY_BUILD_UI=none -DKIEEKEY_BUILD_UI_PROBE=OFF -DKIEEKEY_WERROR=OFF | Out-Null
            $diagLog = "build-${{ matrix.platform }}-diag.log"
            cmake --build out/diag --config Release --parallel 2>&1 | Tee-Object -FilePath $diagLog | Out-Null
            $seenDiag = @{}
            $uniqueDiag = New-Object System.Collections.Generic.List[string]
            foreach ($line in (Get-Content $diagLog)) {
              if ($line -match $notePattern) {
                $rel = $matches[1]
                if ($rel.Length -gt 110) { $rel = $rel.Substring($rel.Length - 110) }
                $nline = $matches[2]
                $noteText = ($matches[4] -replace '\s*\[[^\[\]]*\.vcxproj\]$', '').Trim()
                if ($noteText.Length -gt 200) { $noteText = $noteText.Substring(0, 200) }
                $nkey = "$rel($nline)"
                if (-not $notes.ContainsKey($nkey)) {
                  $notes[$nkey] = $true
                  $noteList.Add("instantiation site: $rel($nline) -- $noteText")
                }
              }
              if ($line -match '^(.*?)\((\d+)(,\d+)?\):\s*(error|warning)\s+([A-Z]+[0-9]+):\s*(.*)$') {
                $file = $matches[1]
                $lineno = $matches[2]
                $code_ = $matches[5]
                $msg = ($matches[6] -replace '\s*\[[^\[\]]*\.vcxproj\]$', '').Trim()
                $key = "$code_|$msg"
                if (-not $seenDiag.ContainsKey($key)) {
                  $seenDiag[$key] = $true
                  $entry = "$code_ $msg  <- $file($lineno)"
                  if ($entry.Length -gt 880) { $entry = $entry.Substring(0, 880) }
                  $uniqueDiag.Add($entry)
                }
              }
            }
            Write-Host "::error::full warning inventory: $($uniqueDiag.Count) unique (first 50 shown)"
            foreach ($entry in ($uniqueDiag | Select-Object -First 50)) {
              Write-Host "::error::$entry"
            }
            if ($noteList.Count -gt 0) {
              Write-Host "::error::$($noteList.Count) instantiation site(s) in the KieeKey tree"
              foreach ($entry in ($noteList | Select-Object -First 50)) {
                Write-Host "::error::$entry"
              }
            }
            exit $code
          }

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: build-log-${{ matrix.platform }}
          path: build-${{ matrix.platform }}*.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Run unit tests
        if: matrix.platform == 'x64'
        run: |
          function Publish-Notice([string]$Title, [string]$Body) {
            $escaped = $Body.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Host "::notice title=${Title}::$escaped"
          }
          $inventory = @(ctest --test-dir out/${{ matrix.platform }} -C Release -N)
          $inventoryCode = $LASTEXITCODE
          $inventory | Write-Output
          if ($inventoryCode -ne 0) { exit $inventoryCode }
          Publish-Notice 'x64 ctest -N inventory' ($inventory -join "`n")

          $report = Join-Path $env:RUNNER_TEMP 'x64-ctest-results.xml'
          ctest --test-dir out/${{ matrix.platform }} -C Release --parallel $env:NUMBER_OF_PROCESSORS --output-on-failure --output-junit $report
          $testCode = $LASTEXITCODE
          if (Test-Path $report) {
            [xml]$result = Get-Content $report -Raw
            $suite = $result.testsuite
            $summary = @('tests=' + $suite.tests + '; failures=' + $suite.failures + '; disabled=' + $suite.disabled + '; skipped=' + $suite.skipped)
            foreach ($case in $suite.testcase) {
              $state = if ($case.SelectSingleNode('failure|error')) { 'failed' } elseif ($case.SelectSingleNode('skipped')) { 'skipped' } else { 'passed' }
              $summary += "$($case.name): $state ($($case.time)s)"
            }
            Publish-Notice 'x64 CTest executed results' ($summary -join "`n")
          } elseif ($testCode -eq 0) {
            throw 'CTest succeeded but the JUnit report is missing'
          }
          exit $testCode

      # v1.3.0-beta8 (CA-03/CA-05): the Windows UI probe. It opens the REAL
      # settings dialog through the app's own creation path (probe-only entry
      # points, -DKIEEKEY_UI_PROBE) and audits what the USER sees — not just the
      # rectangles Windows reports:
      #
      #   * the EFFECTIVE rectangle of every control (window rect translated by
      #     its window region), so a hidden or mis-clipped control cannot pass;
      #   * one page at a time (a control of another tab may never be visible);
      #   * the real scroll path (WM_VSCROLL/thumb through the whole range), which
      #     the runner's large 96-dpi desktop otherwise never exercises;
      #   * the 150 % layout, driven through the app's own DPI-change path
      #     (KieeKeyProbeSimulateDpi) after the native pass.
      #
      # Exits non-zero on any finding; ui_probe.json + one PNG per tab/scale are
      # uploaded.
      - name: UI probe (real HWNDs, real font metrics)
        if: matrix.platform == 'x64'
        shell: pwsh
        run: |
          $dir = "ui-probe"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          & "out/x64/Release/kieekey_ui_probe.exe" $dir
          $code = $LASTEXITCODE
          if (Test-Path "$dir/ui_probe.json") {
            $json = Get-Content "$dir/ui_probe.json" -Raw | ConvertFrom-Json
            $kinds = ($json.findingsByKind.PSObject.Properties | ForEach-Object { "$($_.Name)=$($_.Value)" }) -join ' '
            # One line per (tab, scale) INSIDE the notice: the per-tab detail
            # lives in the annotations below, which GitHub caps at 10 per step —
            # so the digest is the only channel that always lists EVERY measured
            # tab (travel included), even when findings push annotations out.
            $digest = @()
            foreach ($tab in $json.tabs) {
              $digest += ('t' + $tab.tab + '@' + $tab.scale + '%=' + $tab.findings.Count)
            }
            Write-Host "::notice title=UI probe::$($json.controls) controls, $($json.checks) checks, $($json.findings) findings [$kinds] (native DPI $($json.nativeDpi), scales $(($json.tabs | Select-Object -ExpandProperty scale -Unique) -join '/'), screen checks $($json.screenCaptures) run / $($json.screenUnavailable) unavailable) :: $($digest -join ' ')"
            # v1.3.0-beta8 (CA-05): ONE annotation per TAB, carrying both scales
            # (findings AND the geometry digest) — 9 tabs + the notice == the
            # 10-annotation budget exactly, so no measured tab is ever dropped.
            # 150 % comes first inside each: it is the scale that reproduces the
            # user's report on a 1920x1080 desktop, and it is read first.
            foreach ($group in ($json.tabs | Group-Object tab)) {
              $lines = @()
              $bad = 0
              foreach ($tab in ($group.Group | Sort-Object -Property @{Expression={-$_.scale}})) {
                $bad += [int]$tab.findings.Count
                $geo = @()
                foreach ($g in $tab.geometry) { $geo += $g }
                $lines += "tab $($tab.tab) @$($tab.scale)% dialog=$($tab.dialog -join 'x') page=[$($tab.page -join ',')] travel=$($tab.scrollTravel) $($tab.findings.Count) finding(s) [$($tab.findings.Count)]"
                foreach ($f in $tab.findings) { $lines += "  [$($f.kind)] $($f.detail)" }
                if ($geo.Count -gt 0) { $lines += "  geometry: $($geo -join ' | ')" }
              }
              if ($bad -eq 0) { continue }
              # GitHub annotations need the newline ESCAPED — a literal one
              # truncates the command to its first line.
              $msg = ($lines -join '%0A')
              Write-Host "::error title=tab $($group.Name)::$msg"
            }
          } else {
            Write-Host "::error::the UI probe did not write ui_probe.json"
          }
          exit $code

      - name: Upload UI probe artifacts
        if: always() && matrix.platform == 'x64'
        uses: actions/upload-artifact@v7
        with:
          name: ui-probe-${{ matrix.platform }}
          path: ui-probe/
          if-no-files-found: warn
          retention-days: 14

      # v1.2.2 RC4 (B-5): the SHA256 release manifest must stay in sync with
      # the tree it ships from — the same gate tests/run_all_tests.sh runs.
      - name: Verify SHA256SUMS manifest
        if: matrix.platform == 'x64'
        shell: bash
        run: bash scripts/gen_sha256sums.sh --check

      - name: Collect artifacts
        shell: pwsh
        run: |
          $src = "out/${{ matrix.platform }}/Release"
          $dst = "KieeKey-${{ matrix.platform }}"
          New-Item -ItemType Directory -Force -Path $dst | Out-Null
          Copy-Item "$src/KieeKeyApp.exe"    $dst
          Copy-Item "$src/ok_tests.exe"      $dst
          Copy-Item "$src/ok_ring_tests.exe" $dst
          Copy-Item "$src/ok_wrap_tests.exe" $dst
          # v1.3.0: the Arcade Hub web bridge + its assets ship with the app so
          # the HTML5 player can run on a machine the user controls (see
          # scripts/run_web_bridge.ps1) instead of only in an ephemeral sandbox.
          foreach ($tool in @('arcade_serve.exe', 'arcade_bench.exe')) {
            $path = Join-Path $src $tool
            if (Test-Path $path) { Copy-Item $path $dst }
            else { Write-Host "::warning::$tool was not built — check the arcade target" }
          }
          $webSrc = Join-Path "out/${{ matrix.platform }}" "web"
          if (Test-Path $webSrc) {
            Copy-Item $webSrc (Join-Path $dst "web") -Recurse
          } else {
            Write-Host "::warning::web assets were not copied into the build tree"
          }
          Copy-Item "LICENSE" $dst
          Copy-Item "README.md" $dst
          Copy-Item "scripts/run_web_bridge.ps1" $dst
          Copy-Item "scripts/run_web_bridge.sh"  $dst
          Compress-Archive -Path "$dst/*" -DestinationPath "$dst.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: KieeKey-${{ matrix.platform }}
          path: KieeKey-${{ matrix.platform }}.zip
          if-no-files-found: error
          retention-days: 14

  #---------------------------------------------------------------------------
  # Tag releases: attach the per-platform artifact zips to a GitHub Release.
  #---------------------------------------------------------------------------
  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, native]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: KieeKey-*

      # download-artifact (v4+) EXTRACTS each artifact into
      # artifacts/<name>/... — there are no .zip files on disk afterwards.
      # Repack each artifact directory into <name>.zip so the release
      # actually attaches the per-platform binaries (the old
      # `files: artifacts/**/*.zip` glob matched nothing).
      - name: Repack per-platform release zips
        shell: bash
        run: |
          shopt -s nullglob
          for d in artifacts/*/; do
            name=$(basename "$d")
            (cd "$d" && zip -r "../${name}.zip" .)
          done
          ls -la artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: artifacts/*.zip
          generate_release_notes: true
